name: Build DiscordWear beta

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore app/release-key.jks -keyalg RSA -keysize 2048 -validity 10000 -alias my-alias -storepass mypassword -keypass mypassword -dname "CN=Unknown, OU=Unknown, O=Unknown, L=Unknown, ST=Unknown, C=Unknown"

      - name: Build release APK
        run: ./gradlew app:assembleRelease --stacktrace
        env:
          KEYSTORE_PATH: release-key.jks
          KEYSTORE_PASSWORD: mypassword
          KEY_ALIAS: my-alias
          KEY_PASSWORD: mypassword

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: discordwear-release-alpha
          path: app/build/outputs/apk/release/*.apk
